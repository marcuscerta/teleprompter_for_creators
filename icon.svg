<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <radialGradient id="lens" cx=".38" cy=".3" r=".9">
      <stop offset="0" stop-color="#3a2a5c"/>
      <stop offset="1" stop-color="#120c22"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd8b0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- lens -->
  <circle cx="256" cy="256" r="178" fill="url(#ring)"/>
  <circle cx="256" cy="256" r="162" fill="url(#lens)"/>
  <!-- centered script lines: faded above, bright reading line, upcoming below -->
  <rect x="176" y="168" width="160" height="22" rx="11" fill="#fff" opacity=".28"/>
  <rect x="146" y="214" width="220" height="30" rx="15" fill="#fff"/>
  <rect x="186" y="266" width="140" height="22" rx="11" fill="#fff" opacity=".7"/>
  <rect x="206" y="308" width="100" height="22" rx="11" fill="#fff" opacity=".45"/>
  <!-- reading-line markers -->
  <path d="M112 229 l22 -14 v28z" fill="#ff9f43"/>
  <path d="M400 229 l-22 -14 v28z" fill="#ff9f43"/>
  <!-- lens glint -->
  <path d="M158 196 a118 118 0 0 1 70 -48" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".5"/>
  <!-- record dot -->
  <circle cx="400" cy="112" r="30" fill="#fff"/>
  <circle cx="400" cy="112" r="20" fill="#ff2d55"/>
</svg>
